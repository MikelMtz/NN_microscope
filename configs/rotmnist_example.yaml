run_name: mnist08_11/mnist_d=5_long
seed: 123

# data
train_size: 60000  # Full MNIST training set
test_size: 10000   # Full MNIST test set
dim: 784           # MNIST images are 28x28 = 784
spec: ""           # Not used for RotMNIST, but required
noise_std: 0.0
shuffle_labels: false
dataset: mnist  # Use Rotated MNIST dataset

# model
width: 512
depth: 5
activation: relu

# training
epochs: 10000
lr: 2.0e-3
optimizer: sgd
momentum: 0.0
mode: sgd
batch_size: 4096

# device
device: cuda

# kernel metrics
compute_kernel: true
compute_kernel_every: 10
kernel_set: train
max_kernel_points: 10000
last_top_k: 15
lower_top_k: 15
betas: [0.2, 0.2, 0.2]
track_U: true
save_transfers: true

